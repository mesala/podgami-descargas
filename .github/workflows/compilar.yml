name: Compilar Mac y Linux

# Podgami Montaje para Mac (Apple Silicon e Intel) y Linux, en cuanto se publica una versión de Windows (scripts/publicar-montaje.mjs).
# Aquí, por ser un repositorio público, GitHub no cobra los minutos de Mac. El código está en el repositorio privado mesala/podgami:
# se lee con una clave de solo lectura (secreto PODGAMI_CLAVE, la «deploy key» «Compilar desde podgami-descargas» de ese repo).
# Se puede lanzar a mano (Actions › Compilar Mac y Linux › Run workflow) con la versión, p. ej. 0.22.0.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (p. ej. 0.22.0). Vacío: la de la última publicación."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.event.release.tag_name || inputs.version || 'ultima' }}
  cancel-in-progress: false

jobs:
  compilar:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, nombre: Mac Apple Silicon }
          - { os: macos-15-intel, nombre: Mac Intel }
          - { os: ubuntu-22.04, nombre: Linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Código de Podgami (privado, solo lectura)
        uses: actions/checkout@v4
        with:
          repository: mesala/podgami
          ssh-key: ${{ secrets.PODGAMI_CLAVE }}
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión
        shell: bash
        env:
          ETIQUETA: ${{ github.event.release.tag_name }}
          PEDIDA: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${PEDIDA:-${ETIQUETA#v}}"
          [ -n "$V" ] || V="$(gh release view -R mesala/podgami-descargas --json tagName -q .tagName | sed 's/^v//')"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Versión rara: $V"; exit 1; }
          sed -i.bak -E "s/^VERSION = \"[0-9.]+\"/VERSION = \"$V\"/" montaje/podgami_montaje.py && rm montaje/podgami_montaje.py.bak
          grep '^VERSION' montaje/podgami_montaje.py
      - name: Herramientas de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-venv dpkg-dev curl
      - name: Compilar, probar y subir a las descargas
        shell: bash
        timeout-minutes: 65
        env:
          PYTHONIOENCODING: utf-8
          PODGAMI_HUMO: ${{ github.workspace }}/humo
          GH_TOKEN: ${{ github.token }}
          PYTHON: python
        run: |
          case "$RUNNER_OS" in
            Linux) sh montaje/compilar_linux.sh --subir ;;
            macOS) sh montaje/compilar_mac.sh --subir ;;
          esac
